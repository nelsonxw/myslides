[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myslides"
version = "0.1.0"
description = "AI-assisted PowerPoint template library, design learner, and one-page slide generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
myslides = "myslides.web.app:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --disable-warnings"
